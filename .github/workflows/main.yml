name: HLTV Real-Time Sync

on:
  schedule:
    - cron: '0 * * * *' # Executa a cada hora automaticamente
  workflow_dispatch: # Permite execução manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Instalando na raiz onde o sync.js está localizado
        run: npm install hltv @supabase/supabase-js

      - name: Run Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Executa diretamente na raiz do repositório
        run: |
              cd cs2-prediction-frontend
              node sync.js

